<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Aksat Upadhyay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 480px;
    }
    .error-code {
      font-size: clamp(64px, 12vw, 96px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .error-code span:nth-child(1) { color: #fa8b2a; }
    .error-code span:nth-child(2) { color: #84bd4b; }
    .error-code span:nth-child(3) { color: #8000ff; }
    h1 {
      font-size: clamp(20px, 4vw, 26px);
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .home-link {
      display: inline-block;
      padding: 12px 24px;
      background-color: #111827;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
      font-size: 15px;
      transition: background-color 0.15s ease;
    }
    .home-link:hover {
      background-color: #374151;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">
      <span>4</span><span>0</span><span>4</span>
    </div>
    <h1>This URL does not exist my friend.</h1>
    <p>Pro Tip: Go to a page that actually exists next time.</p>
    <a href="/" class="home-link">Back to Reality (not really)</a>
  </div>
</body>
</html>
